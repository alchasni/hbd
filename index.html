<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Happy Birthday 🎉</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Poppins', system-ui, sans-serif;
            background: radial-gradient(circle at top, #1b1b3a, #0b0b18);
            color: white;
        }

        canvas { position: fixed; inset: 0; z-index: 0; }

        .center {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; z-index: 4; pointer-events: none;
        }

        h1 {
            font-size: 3rem;
            text-shadow: 0 0 25px rgba(255,180,255,0.9);
            animation: float 4s ease-in-out infinite;
        }

        .tap {
            position: absolute; bottom: 24px;
            font-size: 0.9rem; opacity: 0.7;
            animation: pulse 2s infinite;
        }

        .message {
            position: absolute; inset: 0;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 32px; z-index: 5;
            background: radial-gradient(circle, rgba(0,0,0,0.4), rgba(0,0,0,0.9));
            animation: pop 0.8s cubic-bezier(.2,.9,.3,1) forwards;
        }

        .message h2 {
            font-size: 2.4rem; margin-bottom: 1rem;
            text-shadow: 0 0 25px rgba(255,150,255,0.9);
        }

        .message p {
            font-size: 1.1rem; line-height: 1.7;
            max-width: 420px; opacity: 0.95;
            text-align: center;
        }

        .hint {
            margin-top: 16px;
            font-size: 0.9rem;
            opacity: 0.6;
            animation: pulse 2s infinite;
        }

        .balloon {
            position: absolute; bottom: -120px;
            width: 52px; height: 72px;
            border-radius: 50% 50% 45% 45%;
            animation: balloonRise 14s linear infinite;
            z-index: 3;
        }

        .balloon::after {
            content: ''; position: absolute;
            bottom: -22px; left: 50%;
            width: 2px; height: 26px;
            background: rgba(255,255,255,0.5);
            transform: translateX(-50%);
        }

        @keyframes float { 50% { transform: translateY(-14px); } }
        @keyframes pulse { 50% { opacity: 1; } }
        @keyframes pop { from { transform: scale(0.6); opacity: 0; } }
        @keyframes balloonRise { to { transform: translateY(-150vh); } }
    </style>
</head>
<body>
<canvas id="bg"></canvas>

<audio id="music" preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2023/03/28/audio_0a9a7e3d6d.mp3" type="audio/mpeg">
</audio>

<div class="center" id="intro">
    <h1>🎂 HBD AZKA 🎂</h1>
    <div class="tap">Tap anywhere ✨</div>
</div>

<div class="message" id="message">
    <h2>Happy Birthday 💖</h2>
    <p id="msgText">
        Semoga panjang umur dan sehat selalu 🌸
    </p>
    <div class="hint">Tap the screen 💫</div>
</div>

<script>
    // ===== Canvas Background + Fireworks =====
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');
    let w, h;

    function resize() {
        w = canvas.width = innerWidth;
        h = canvas.height = innerHeight;
    }
    resize(); addEventListener('resize', resize);

    const stars = Array.from({ length: 140 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 2 + 0.5,
        s: Math.random() * 0.3 + 0.1
    }));

    const fireworks = [];

    function explode(x, y) {
        const color = `hsl(${Math.random()*360},100%,60%)`;
        for (let i = 0; i < 50; i++) {
            fireworks.push({
                x, y,
                vx: Math.cos(i) * (Math.random()*4+2),
                vy: Math.sin(i) * (Math.random()*4+2),
                life: 60,
                color
            });
        }
    }

    function animate() {
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(0,0,w,h);

        for (const s of stars) {
            s.y -= s.s;
            if (s.y < 0) s.y = h;
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fill();
        }

        for (let i = fireworks.length - 1; i >= 0; i--) {
            const f = fireworks[i];
            f.x += f.vx; f.y += f.vy; f.vy += 0.05; f.life--;
            ctx.fillStyle = f.color;
            ctx.beginPath();
            ctx.arc(f.x, f.y, 2, 0, Math.PI * 2);
            ctx.fill();
            if (f.life <= 0) fireworks.splice(i, 1);
        }

        requestAnimationFrame(animate);
    }
    animate();

    // ===== Interaction Logic =====
    const intro = document.getElementById('intro');
    const message = document.getElementById('message');
    const music = document.getElementById('music');
    const msgText = document.getElementById('msgText');

    const messages = [
        "Semoga panjang umur dan sehat selalu 🌸",
        "Bertambah umur, bertambah berkah 🎈",
        "Semoga Allah memudahkan segala urusan dan mengabulkan doa-doamu 🌟",
        "May your day be filled with laughter, love, and all the happiness you deserve 💖",
        "بَارَكَ اللَّهُ فِي عُمْرِكِ ✨",
        "I hope this year brings you beautiful surprises 🎂"
    ];

    let started = false;
    let msgIndex = 0;

    function startExperience(e) {
        if (!started) {
            started = true;
            intro.style.display = 'none';
            message.style.display = 'flex';
            music.volume = 0.8;
            music.play().catch(() => {});
            spawnBalloons();
        }

        // Every tap after start = personal reaction
        explode(e.clientX || w/2, e.clientY || h/2);
        msgIndex = (msgIndex + 1) % messages.length;
        msgText.textContent = messages[msgIndex];
    }

    document.addEventListener('pointerdown', startExperience);

    function spawnBalloons() {
        const colors = ['#ff6b6b','#ffd93d','#6bcfff','#c77dff','#4dffd2'];
        for (let i = 0; i < 7; i++) {
            const b = document.createElement('div');
            b.className = 'balloon';
            b.style.left = Math.random() * 100 + 'vw';
            b.style.background = colors[i % colors.length];
            b.style.animationDelay = Math.random() * 6 + 's';
            document.body.appendChild(b);
        }
    }
</script>
</body>
</html>
